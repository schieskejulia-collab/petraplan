name: N64 OpenAI Live Proof

on:
  push:
    branches:
      - test/n64-openai-proof-exec
  workflow_dispatch:

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify secret is available
        run: test -n "$OPENAI_API_KEY"

      - name: Run live N64 OpenAI proof
        run: node dist/services/openaiLiveProof.js

      - name: Run adversarial N64 hardening proof
        run: node dist/services/openaiHardeningProof.js
