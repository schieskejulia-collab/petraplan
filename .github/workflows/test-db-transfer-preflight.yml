name: PetraPlan database transfer preflight
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_DATABASE_URL: ${{ secrets.PETRAPLAN_PROD_READONLY_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.PETRAPLAN_TEST_DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - name: Verify database credentials are configured
        shell: bash
        run: |
          if [[ -z "$PROD_DATABASE_URL" || -z "$TEST_DATABASE_URL" ]]; then
            echo "::error::Database URLs are not configured. No connection or transfer attempted."
            exit 1
          fi
          echo "Both required connection settings are present (values hidden)."
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Read-only structural and row-count preflight
        shell: bash
        run: |
          set -euo pipefail
          for target in PROD TEST; do
            if [[ "$target" == PROD ]]; then url="$PROD_DATABASE_URL"; else url="$TEST_DATABASE_URL"; fi
            echo "=== $target ==="
            psql "$url" -X -v ON_ERROR_STOP=1 -Atc "SELECT 'public_tables=' || count(*) FROM pg_tables WHERE schemaname='public';"
            psql "$url" -X -v ON_ERROR_STOP=1 -Atc "SELECT 'records=' || count(*) FROM public.records;"
            psql "$url" -X -v ON_ERROR_STOP=1 -Atc "SELECT 'ingestion_logs=' || count(*) FROM public.ingestion_logs;"
            psql "$url" -X -v ON_ERROR_STOP=1 -Atc "SELECT 'claims=' || count(*) FROM public.claims;"
            psql "$url" -X -v ON_ERROR_STOP=1 -Atc "SELECT 'review_decisions=' || count(*) FROM public.review_decisions;"
            psql "$url" -X -v ON_ERROR_STOP=1 -Atc "SELECT 'release_certificates=' || count(*) FROM public.release_certificates;"
          done
          echo "Read-only preflight complete. No data exported or modified."
