name: PetraPlan CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Compile Bridge pipeline, constraints, state, transitions, evidence, ingress context, addressing, capability profile, runtime gate, adapter contract, source readiness, type conversion safety, canonical mapping, provenance, instance profile, relation verification, relation decision, subtype profile, collection profile, hierarchy profile, component profile, freshness profile, addressable read plan, read access decision, query abstraction, query read gate, query trace report and unified trace report for node tests
        run: |
          npx tsc src/lib/bridge-pipeline.ts src/lib/bridge-constraints.ts src/lib/bridge-state.ts src/lib/bridge-transition.ts src/lib/bridge-evidence.ts src/lib/bridge-ingress-context.ts src/lib/bridge-addressing.ts src/lib/bridge-capability-profile.ts src/lib/bridge-runtime-decision.ts src/lib/bridge-adapter-contract.ts src/lib/bridge-source-readiness.ts src/lib/bridge-type-conversion.ts src/lib/bridge-canonical-mapping.ts src/lib/bridge-provenance.ts src/lib/bridge-instance-profile.ts src/lib/bridge-relation-verification.ts src/lib/bridge-relation-decision.ts src/lib/bridge-profiled-evaluation.ts src/lib/bridge-relation-demo.ts src/lib/bridge-subtype-profile.ts src/lib/bridge-collection-profile.ts src/lib/bridge-hierarchy-profile.ts src/lib/bridge-component-profile.ts src/lib/bridge-freshness-profile.ts src/lib/bridge-addressable-read-plan.ts src/lib/bridge-read-access-decision.ts src/lib/bridge-query-abstraction.ts src/lib/bridge-query-read-gate.ts src/lib/bridge-query-trace-report.ts src/lib/bridge-unified-trace-report.ts --target ES2022 --module ES2022 --moduleResolution bundler --skipLibCheck --outDir .bridge-test-build
          sed -i 's|from "./bridge-constraints";|from "./bridge-constraints.js";|' .bridge-test-build/bridge-pipeline.js
          sed -i 's|from "./bridge-state";|from "./bridge-state.js";|' .bridge-test-build/bridge-pipeline.js
          sed -i 's|from "./bridge-canonical-mapping";|from "./bridge-canonical-mapping.js";|' .bridge-test-build/bridge-pipeline.js
          sed -i 's|from "./bridge-provenance";|from "./bridge-provenance.js";|' .bridge-test-build/bridge-pipeline.js
          sed -i 's|from "./bridge-constraints";|from "./bridge-constraints.js";|' .bridge-test-build/bridge-state.js
          sed -i 's|from "./bridge-pipeline";|from "./bridge-pipeline.js";|' .bridge-test-build/bridge-transition.js
          sed -i 's|from "./bridge-state";|from "./bridge-state.js";|' .bridge-test-build/bridge-transition.js
          sed -i 's|from "./bridge-capability-profile";|from "./bridge-capability-profile.js";|' .bridge-test-build/bridge-runtime-decision.js
          sed -i 's|from "./bridge-ingress-context";|from "./bridge-ingress-context.js";|' .bridge-test-build/bridge-source-readiness.js
          sed -i 's|from "./bridge-addressing";|from "./bridge-addressing.js";|' .bridge-test-build/bridge-source-readiness.js
          sed -i 's|from "./bridge-adapter-contract";|from "./bridge-adapter-contract.js";|' .bridge-test-build/bridge-source-readiness.js
          sed -i 's|from "./bridge-capability-profile";|from "./bridge-capability-profile.js";|' .bridge-test-build/bridge-source-readiness.js
