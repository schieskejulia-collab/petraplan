name: StinoDino EDIFACT proof

on:
  pull_request:
    paths:
      - 'tests/edifact/**'
      - '.github/workflows/stinodino-edifact-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edifact-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run EDIFACT parser and mathematics safety gates
        run: node --test tests/edifact/stinodino-entry.test.mjs tests/edifact/stinodino-math-evidence-gates.test.mjs
