name: N64 Ingestion CI

on:
  push:
    branches:
      - feature/n64-ingestion-core
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm install

      - name: Build and test API
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend/mobile-app
        run: npm install

      - name: Typecheck frontend
        working-directory: frontend/mobile-app
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend/mobile-app
        run: npm run build
